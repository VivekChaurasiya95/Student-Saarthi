{% extends 'layouts/base.html' %}

{% block title %}Access Forbidden - Student Saarthi{% endblock %}

{% block content %}
<section class="section" style="margin-top: 100px; text-align: center; min-height: 60vh; display: flex; align-items: center;">
    <div class="container">
        <div style="max-width: 600px; margin: 0 auto;">
            <i class="fas fa-shield-alt" style="font-size: 80px; color: var(--error-color); margin-bottom: 24px;"></i>
            <h1 style="font-size: 48px; margin-bottom: 16px;">403</h1>
            <h2 style="margin-bottom: 16px;">Access Forbidden</h2>
            <p style="color: var(--text-secondary); margin-bottom: 32px; font-size: 18px;">
                You do not have permission to access this page. Please log in with appropriate credentials.
            </p>
            <div style="display: flex; gap: 16px; justify-content: center;">
                <a href="/login.html" class="btn btn-primary">
                    <i class="fas fa-sign-in-alt"></i> Login
                </a>
                <a href="/" class="btn btn-outline">
                    <i class="fas fa-home"></i> Back to Home
                </a>
            </div>
        </div>
    </div>
</section>
{% endblock %}
